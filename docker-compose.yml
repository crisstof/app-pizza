services:
  db:
    image: postgres:16-alpine
    container_name: app_one_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_one
      POSTGRES_PASSWORD: app_one_dev_password
      POSTGRES_DB: app_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_one -d app_one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
